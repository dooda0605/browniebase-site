<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img"
     aria-label="다이브샵 예시 사진 — 강사와 수강생이 함께 입수하는 장면">
  <!--
    [2026-09-21] 파트너 랜딩 히어로의 「앱에 이렇게 올라갑니다」 데모 카드용 예시 이미지.
    실제 사진이 아니라 **일러스트**다. 샵이 흔히 올리는 홍보 사진(강사진·수강생 동반 입수)을
    본뜬 것이고, 실제 파트너 사진이 확보되면 교체 대상이다.
    색은 사이트 팔레트(sea 그라데이션 #1A73E8 → #14B8A6, 배경 #0B1220)를 따른다.
  -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1fb6c9"/>
      <stop offset="45%"  stop-color="#0e6a8a"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bdf0f7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#bdf0f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/><stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
  </defs>

  <rect width="360" height="420" fill="url(#water)"/>

  <!-- 수면 광선 -->
  <g>
    <polygon points="20,0 62,0 150,420 92,420"  fill="url(#ray)"/>
    <polygon points="140,0 168,0 250,420 210,420" fill="url(#ray)" opacity=".7"/>
    <polygon points="250,0 292,0 352,420 318,420" fill="url(#ray)" opacity=".5"/>
  </g>

  <!-- 수면 잔물결 -->
  <g stroke="#d8f6fb" fill="none" stroke-linecap="round">
    <path d="M-10 26 q22 -9 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0" stroke-opacity=".75" stroke-width="3"/>
    <path d="M-10 44 q26 -8 52 0 t52 0 t52 0 t52 0 t52 0 t52 0"       stroke-opacity=".45" stroke-width="2.5"/>
    <path d="M-10 60 q30 -7 60 0 t60 0 t60 0 t60 0 t60 0"             stroke-opacity=".25" stroke-width="2"/>
  </g>

  <!-- 뒤쪽 다이버 (수강생) -->
  <g transform="translate(232 196) scale(.82) rotate(8)" opacity=".92">
    <ellipse cx="0" cy="0" rx="34" ry="21" fill="#0f2a44"/>
    <rect x="-30" y="-26" width="26" height="30" rx="9" fill="#123655"/>
    <circle cx="26" cy="-7" r="14" fill="#14324e"/>
    <path d="M14 -12 a14 14 0 0 1 20 3 l-7 6 a9 9 0 0 0 -12 -2 z" fill="#8fd6e8" opacity=".9"/>
    <path d="M-34 4 l-30 12 l6 -18 z" fill="url(#fin)" opacity=".85"/>
  </g>

  <!-- 앞쪽 다이버 (강사) -->
  <g transform="translate(128 250) rotate(-6)">
    <path d="M-52 6 l-34 16 l7 -22 z" fill="url(#fin)"/>
    <ellipse cx="0" cy="0" rx="46" ry="27" fill="#16416a"/>
    <rect x="-40" y="-34" width="32" height="38" rx="11" fill="#1d5480"/>
    <rect x="-36" y="-30" width="24" height="10" rx="4" fill="#0f3354" opacity=".7"/>
    <circle cx="36" cy="-10" r="18" fill="#1b4b76"/>
    <path d="M20 -16 a18 18 0 0 1 26 4 l-9 8 a12 12 0 0 0 -16 -3 z" fill="#a9e6f5"/>
    <path d="M-6 -30 q16 -14 34 -12" stroke="#0f3354" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 손 신호(OK) -->
    <circle cx="58" cy="-34" r="9" fill="none" stroke="#a9e6f5" stroke-width="4"/>
  </g>

  <!-- 기포 -->
  <g fill="#cdf3fb">
    <circle cx="176" cy="212" r="5"   opacity=".85"/>
    <circle cx="190" cy="188" r="3.5" opacity=".7"/>
    <circle cx="182" cy="164" r="2.6" opacity=".55"/>
    <circle cx="196" cy="140" r="2"   opacity=".4"/>
    <circle cx="286" cy="168" r="3.2" opacity=".6"/>
    <circle cx="296" cy="146" r="2.2" opacity=".45"/>
  </g>

  <!-- 바닥 암초 -->
  <path d="M0 420 L0 372 q46 -26 92 -6 q40 18 78 -4 q44 -26 96 -2 q44 22 94 2 L360 420 Z"
        fill="#071624" opacity=".85"/>
</svg>
